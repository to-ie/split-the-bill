# Publishes the landing page, and only the landing page.
#
# dist/ also holds the Flutter web build and, after a local build, two APKs.
# Neither belongs on the site: the web build is a development convenience, and
# the APKs are published as release assets so they do not sit in git history.
# This copies the handful of files the page actually needs rather than
# publishing the folder, so nothing can wander in by accident.
name: Landing page

on:
  push:
    branches: [main]
    paths:
      - 'dist/index.html'
      - 'dist/robots.txt'
      - 'dist/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the page
        run: |
          set -euo pipefail
          mkdir -p _site
          cp dist/index.html _site/
          cp dist/robots.txt _site/
          cp -r dist/site _site/site
          # No Jekyll: this is plain HTML and does not want processing.
          touch _site/.nojekyll

      - name: Check nothing unwanted came with it
        run: |
          set -euo pipefail
          test ! -e _site/web || { echo "the web build must not be published"; exit 1; }
          ! ls _site/*.apk >/dev/null 2>&1 || { echo "APKs belong in a release"; exit 1; }
          test -f _site/index.html
          test -f _site/site/logo.png
          echo "Publishing:"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
